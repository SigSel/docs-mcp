[project]
name = "docs-mcp-conformance"
version = "0.1.0"
description = "Black-box tests that every docs-mcp implementation must pass"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
