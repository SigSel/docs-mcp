apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-mcp
spec:
  # Stateless: every replica clones and indexes on its own, so scaling out is safe.
  replicas: 2
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: docs-mcp
          image: docs-mcp  # set by the overlay's `images:`
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: docs-mcp }
            - secretRef: { name: docs-mcp, optional: true }
          env:
            - { name: DOCS_CACHE_DIR, value: /cache }
            - { name: HOME, value: /tmp }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 60  # five minutes for the first clone
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
