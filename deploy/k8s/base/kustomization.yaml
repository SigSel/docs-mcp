# docs-mcp base. Use it from an overlay that sets the image, the source and the
# allowed host names; see overlays/example.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: docs-mcp
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: docs-mcp
    literals:
      - DOCS_DIR=.
      # A push webhook reaches only one replica; the others catch up on their next pull.
      - DOCS_REFRESH_SECONDS=60
      - DOCS_NAME=docs
      - MCP_PORT=8080
