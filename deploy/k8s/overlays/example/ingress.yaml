# Optional: expose docs-mcp on an internal host name. Add the host to
# MCP_ALLOWED_HOSTS in kustomization.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-mcp
spec:
  rules:
    - host: docs-mcp.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: docs-mcp, port: { name: http } }
