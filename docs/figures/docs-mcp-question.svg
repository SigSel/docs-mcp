<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">From question to answer</title>
  <desc id="desc">You ask in English whether you can use unwrap. The assistant searches docs-mcp in Nynorsk, gets rule RS-203 as the best match, reads that rule, and answers in English, citing RS-203.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .lane { font-weight: 700; font-size: 14px; text-anchor: middle; }
    .b { font-weight: 700; }
    .m { fill: #59636e; font-size: 12.5px; }
    .code { font-family: "Liberation Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #1f2328; }
    .n { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .flow { stroke: #59636e; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="800" height="560" rx="12" fill="#ffffff"/>

  <!-- Lanes -->
  <rect x="16" y="14" width="200" height="532" rx="10" fill="#f6f8fa"/>
  <rect x="228" y="14" width="288" height="532" rx="10" fill="#f6f8fa"/>
  <rect x="528" y="14" width="256" height="532" rx="10" fill="#f6f8fa"/>
  <text x="116" y="40" class="lane" fill="#0969da">You</text>
  <text x="372" y="40" class="lane" fill="#8250df">Your assistant’s model</text>
  <text x="656" y="40" class="lane" fill="#1a7f37">docs-mcp</text>

  <!-- 1 -->
  <rect x="30" y="62" width="174" height="54" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="44" y="85">Can I use unwrap in</text>
  <text x="44" y="103">our Rust service?</text>

  <!-- 2 -->
  <rect x="240" y="130" width="270" height="60" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
  <text x="252" y="151" class="m">Searches in the handbook’s language:</text>
  <text x="252" y="174" class="code">search_docs("unwrap panikk")</text>

  <!-- 3 -->
  <rect x="540" y="204" width="232" height="88" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
  <text x="552" y="225" class="m">Best match:</text>
  <text x="552" y="245" class="b">RS-203: Ingen unwrap i</text>
  <text x="552" y="263" class="b">produksjonskode</text>
  <text x="552" y="281" class="code">rust/rules.mdx#rs-203</text>

  <!-- 4 -->
  <rect x="240" y="306" width="270" height="60" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
  <text x="252" y="327" class="m">Reads the whole rule:</text>
  <text x="252" y="350" class="code">read_doc("rust/rules.mdx", "rs-203")</text>

  <!-- 5 -->
  <rect x="540" y="380" width="232" height="88" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
  <text x="552" y="401" class="m">The rule, as Markdown:</text>
  <text x="552" y="421">Produksjonskode MÅ IKKJE</text>
  <text x="552" y="439">kalle unwrap(). Bruk ?</text>
  <text x="552" y="457">og ein feiltype. …</text>

  <!-- 6 -->
  <rect x="30" y="472" width="474" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="44" y="494" class="b">No. RS-203: production code must not call unwrap().</text>
  <text x="44" y="511" class="b">Use ? and an error type instead.</text>
  <text x="44" y="527" class="m">Source: rust/rules.mdx#rs-203</text>

  <!-- Arrows -->
  <path d="M206,100 L237,140" class="flow" marker-end="url(#a)"/>
  <path d="M512,178 L537,214" class="flow" marker-end="url(#a)"/>
  <path d="M538,282 L513,312" class="flow" marker-end="url(#a)"/>
  <path d="M512,354 L537,390" class="flow" marker-end="url(#a)"/>
  <path d="M538,458 L507,486" class="flow" marker-end="url(#a)"/>

  <!-- Step numbers -->
  <circle cx="30" cy="62" r="10" fill="#1f2328"/><text x="30" y="66" class="n">1</text>
  <circle cx="240" cy="130" r="10" fill="#1f2328"/><text x="240" y="134" class="n">2</text>
  <circle cx="540" cy="204" r="10" fill="#1f2328"/><text x="540" y="208" class="n">3</text>
  <circle cx="240" cy="306" r="10" fill="#1f2328"/><text x="240" y="310" class="n">4</text>
  <circle cx="540" cy="380" r="10" fill="#1f2328"/><text x="540" y="384" class="n">5</text>
  <circle cx="30" cy="472" r="10" fill="#1f2328"/><text x="30" y="476" class="n">6</text>
</svg>
