<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Local and remote MCP servers</title>
  <desc id="desc">A local server is started by your app on your computer and runs as you, so it can reach your files, your secrets and the internet. A remote server runs somewhere else and sees only the tool calls your app sends it.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .h { font-weight: 700; font-size: 15px; }
    .m { fill: #59636e; font-size: 12.5px; }
    .c { text-anchor: middle; }
    .zone { fill: none; stroke: #0969da; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .zl { fill: #0969da; font-size: 12px; font-weight: 700; }
    .flow { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .pill { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="12" fill="#ffffff"/>

  <!-- Local -->
  <rect x="12" y="12" width="380" height="336" rx="10" fill="#f6f8fa"/>
  <text x="32" y="40" class="h">Local server</text>
  <text x="32" y="60" class="m">Your app starts it as a program on your computer.</text>
  <rect x="28" y="76" width="348" height="208" rx="10" class="zone"/>
  <text x="40" y="94" class="zl">Your computer</text>
  <rect x="48" y="108" width="130" height="50" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="113" y="138" class="c" font-weight="700">Assistant app</text>
  <rect x="226" y="108" width="130" height="50" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="291" y="130" class="c" font-weight="700">MCP server</text>
  <text x="291" y="148" class="m c">runs as you</text>
  <path d="M180,133 L222,133" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M291,160 L98,206" class="flow" marker-end="url(#a)"/>
  <path d="M291,160 L210,206" class="flow" marker-end="url(#a)"/>
  <path d="M291,160 L322,206" class="flow" marker-end="url(#a)"/>
  <rect x="48" y="210" width="100" height="30" rx="15" class="pill"/>
  <text x="98" y="230" class="c">your files</text>
  <rect x="160" y="210" width="100" height="30" rx="15" class="pill"/>
  <text x="210" y="230" class="c">your secrets</text>
  <rect x="272" y="210" width="100" height="30" rx="15" class="pill"/>
  <text x="322" y="230" class="c">the internet</text>
  <text x="48" y="268" class="m">It can reach all of these, as you can.</text>
  <text x="32" y="312" font-weight="700">Trust it like any program you install.</text>
  <text x="32" y="332" class="m">Read what it does before you add it.</text>

  <!-- Remote -->
  <rect x="408" y="12" width="380" height="336" rx="10" fill="#f6f8fa"/>
  <text x="428" y="40" class="h">Remote server</text>
  <text x="428" y="60" class="m">It runs somewhere else. Your app reaches it over the network.</text>
  <rect x="424" y="76" width="160" height="208" rx="10" class="zone"/>
  <text x="436" y="94" class="zl">Your computer</text>
  <rect x="440" y="108" width="128" height="50" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="504" y="138" class="c" font-weight="700">Assistant app</text>
  <rect x="454" y="196" width="100" height="30" rx="15" class="pill"/>
  <text x="504" y="216" class="c">your files</text>
  <rect x="454" y="234" width="100" height="30" rx="15" class="pill"/>
  <text x="504" y="254" class="c">your secrets</text>
  <rect x="650" y="108" width="122" height="50" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="711" y="130" class="c" font-weight="700">MCP server</text>
  <text x="711" y="148" class="m c">e.g. docs-mcp</text>
  <path d="M570,127 L646,127" class="flow" marker-end="url(#a)"/>
  <path d="M646,141 L570,141" class="flow" marker-end="url(#a)"/>
  <text x="614" y="119" class="m c">tool call</text>
  <text x="614" y="157" class="m c">result</text>
  <path d="M711,160 L711,206" class="flow" marker-end="url(#a)"/>
  <rect x="656" y="210" width="110" height="30" rx="15" class="pill"/>
  <text x="711" y="230" class="c">its own data</text>
  <text x="428" y="312" font-weight="700">It sees only what your app sends it.</text>
  <text x="428" y="332" class="m">It cannot reach into your computer by itself.</text>
</svg>
