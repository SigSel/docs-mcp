<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
  <title id="title">A tool call, step by step</title>
  <desc id="desc">When the app connects, it asks the server what it can do. When you ask a question, the app passes it to the model with the tool list. The model asks for a tool call, the app sends it to the server, and the result goes back to the model. This can repeat. Then the model answers.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .h { font-weight: 700; font-size: 14px; text-anchor: middle; }
    .band { font-weight: 700; font-size: 13px; fill: #59636e; paint-order: stroke; stroke: #f6f8fa; stroke-width: 8px; stroke-linejoin: round; }
    .msg { text-anchor: middle; }
    .note { fill: #59636e; font-size: 12px; font-style: italic; text-anchor: end; }
    .life { stroke: #afb8c1; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .call { stroke: #1f2328; stroke-width: 1.5; fill: none; }
    .back { stroke: #59636e; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="800" height="540" rx="12" fill="#ffffff"/>

  <!-- Phases -->
  <rect x="12" y="70" width="776" height="92" rx="8" fill="#f6f8fa"/>
  <rect x="12" y="176" width="776" height="350" rx="8" fill="#f6f8fa"/>

  <!-- Lifelines -->
  <line x1="90" y1="56" x2="90" y2="528" class="life"/>
  <line x1="300" y1="56" x2="300" y2="528" class="life"/>
  <line x1="510" y1="56" x2="510" y2="528" class="life"/>
  <line x1="710" y1="56" x2="710" y2="528" class="life"/>

  <text x="24" y="92" class="band">When the app connects</text>
  <text x="24" y="198" class="band">When you ask a question</text>

  <!-- Heads -->
  <rect x="40" y="16" width="100" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="90" y="41" class="h">You</text>
  <rect x="225" y="16" width="150" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="300" y="41" class="h">Assistant app</text>
  <rect x="445" y="16" width="130" height="40" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="510" y="41" class="h">Model</text>
  <rect x="635" y="16" width="150" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="710" y="41" class="h">MCP server</text>

  <!-- 1, 2: connect -->
  <path d="M300,116 L706,116" class="call" marker-end="url(#a)"/>
  <text x="505" y="108" class="msg">Who are you? What can you do?</text>
  <path d="M710,150 L304,150" class="back" marker-end="url(#r)"/>
  <text x="505" y="142" class="msg">name, instructions, tools and their descriptions</text>

  <!-- 3, 4 -->
  <path d="M90,228 L296,228" class="call" marker-end="url(#a)"/>
  <text x="195" y="220" class="msg">“Can I use unwrap?”</text>
  <path d="M300,264 L506,264" class="call" marker-end="url(#a)"/>
  <text x="405" y="256" class="msg">question + tool list</text>

  <!-- Loop frame -->
  <rect x="150" y="282" width="636" height="166" rx="6" fill="none" stroke="#8c959f" stroke-width="1.2"/>
  <path d="M150,288 a6,6 0 0 1 6,-6 L282,282 L282,296 L272,306 L150,306 z" fill="#eaeef2" stroke="#8c959f" stroke-width="1.2"/>
  <text x="160" y="299" font-size="12" font-weight="700" fill="#59636e">repeats as needed</text>

  <!-- 5..8 -->
  <path d="M510,326 L304,326" class="call" marker-end="url(#a)"/>
  <text x="405" y="318" class="msg">call search_docs</text>
  <path d="M300,362 L706,362" class="call" marker-end="url(#a)"/>
  <text x="505" y="354" class="msg">search_docs("unwrap panikk")</text>
  <text x="292" y="378" class="note">may ask you first</text>
  <path d="M710,398 L304,398" class="back" marker-end="url(#r)"/>
  <text x="505" y="390" class="msg">the matching sections, as text</text>
  <path d="M300,434 L506,434" class="call" marker-end="url(#a)"/>
  <text x="405" y="426" class="msg">the result</text>

  <!-- 9, 10 -->
  <path d="M510,474 L304,474" class="call" marker-end="url(#a)"/>
  <text x="405" y="466" class="msg">the answer, citing RS-203</text>
  <path d="M300,508 L94,508" class="back" marker-end="url(#r)"/>
  <text x="195" y="500" class="msg">“No. RS-203 says …”</text>
</svg>
