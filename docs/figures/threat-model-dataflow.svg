<svg xmlns="http://www.w3.org/2000/svg" width="800" height="652" viewBox="0 0 800 652" role="img" aria-labelledby="title desc">
  <title id="title">docs-mcp data flow, trust boundaries and entry points</title>
  <desc id="desc">Six trust zones: your computer, the model provider, the identity provider, the docs-mcp container, the git host, and the platform and build. Eight entry points, E1 to E8, mark where data from outside enters docs-mcp: tool calls, the refresh webhook, health probes, handbook content, git responses, configuration and secrets, the build supply chain, and the identity provider's signing keys.</desc>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .b { font-weight: 700; }
    .m { fill: #59636e; font-size: 12px; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .zl { font-size: 12px; font-weight: 700; }
    .flow { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .ep { fill: #cf222e; }
    .ept { fill: #ffffff; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="800" height="652" rx="12" fill="#ffffff"/>

  <!-- Zone: your computer -->
  <rect x="16" y="16" width="212" height="274" rx="10" fill="#f7fbff" stroke="#0969da" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="28" y="34" class="zl" fill="#0969da">Your computer</text>
  <rect x="32" y="46" width="180" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
  <text x="122" y="69" class="b c">Assistant app</text>
  <text x="122" y="88" class="m c">the MCP client</text>
  <rect x="32" y="150" width="80" height="34" rx="8" class="box"/>
  <text x="72" y="172" class="c">You</text>
  <rect x="32" y="214" width="144" height="60" rx="8" class="box"/>
  <text x="104" y="238" class="b c">Its other tools</text>
  <text x="104" y="257" class="m c">shell, file edits, …</text>
  <path d="M72,106 L72,146" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M140,104 L140,210" class="flow" marker-end="url(#a)"/>
  <text x="132" y="204" class="m e">if allowed</text>

  <!-- Zone: model provider -->
  <rect x="16" y="330" width="212" height="90" rx="10" fill="#fdf8ff" stroke="#8250df" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="28" y="348" class="zl" fill="#8250df">Model provider</text>
  <rect x="32" y="358" width="180" height="50" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.3"/>
  <text x="122" y="379" class="b c">Model</text>
  <text x="122" y="397" class="m c">Claude, GPT, …</text>

  <!-- App <-> model -->
  <path d="M196,106 L196,354" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="186" y="314" class="m e">conversation and tool results</text>

  <!-- Zone: docs-mcp container -->
  <rect x="300" y="16" width="240" height="380" rx="10" fill="#f6fff8" stroke="#1a7f37" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="312" y="34" class="zl" fill="#1a7f37">docs-mcp container</text>
  <rect x="316" y="46" width="208" height="54" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="420" y="69" class="b c">Guard</text>
  <text x="420" y="88" class="m c">Host check, then token</text>
  <rect x="316" y="118" width="208" height="54" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="420" y="141" class="b c">Five read-only tools</text>
  <text x="420" y="160" class="m c">return text, change nothing</text>
  <rect x="316" y="190" width="208" height="54" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="420" y="213" class="b c">In-memory index</text>
  <text x="420" y="232" class="m c">rebuilt from each new commit</text>
  <rect x="316" y="262" width="208" height="54" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="420" y="285" class="b c">Sync</text>
  <text x="420" y="304" class="m c">git clone, then fetch</text>
  <rect x="316" y="330" width="100" height="52" rx="8" class="box"/>
  <text x="366" y="352" class="c">/healthz</text>
  <text x="366" y="370" class="c">/readyz</text>
  <rect x="424" y="330" width="100" height="52" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.3"/>
  <text x="474" y="352" class="b c">Secrets</text>
  <text x="474" y="370" class="m c">git + MCP token</text>
  <path d="M420,102 L420,116" class="flow" marker-end="url(#a)"/>
  <path d="M420,174 L420,188" class="flow" marker-end="url(#a)"/>
  <path d="M420,260 L420,246" class="flow" marker-end="url(#a)"/>

  <!-- App <-> guard (E1) -->
  <path d="M214,73 L312,73" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="264" y="64" class="m c">tool calls</text>

  <!-- Zone: git host -->
  <rect x="610" y="220" width="174" height="116" rx="10" fill="#fffaf5" stroke="#bc4c00" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="622" y="238" class="zl" fill="#bc4c00">Git host</text>
  <rect x="626" y="252" width="144" height="64" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
  <text x="698" y="279" class="b c">Handbook repo</text>
  <text x="698" y="298" class="m c">pages and history</text>

  <!-- Authors -->
  <circle cx="682" cy="56" r="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
  <path d="M663,94 a19,19 0 0 1 38,0 z" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
  <circle cx="714" cy="56" r="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
  <path d="M695,94 a19,19 0 0 1 38,0 z" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.3"/>
  <text x="698" y="116" class="b c">Handbook authors</text>
  <path d="M698,124 L698,248" class="flow" marker-end="url(#a)"/>
  <text x="708" y="170" class="m">push pages</text>

  <!-- Sync <-> repo (E5) -->
  <path d="M526,289 L622,289" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="582" y="281" class="m c">git fetch</text>

  <!-- Webhook (E2) -->
  <path d="M646,250 L528,84" class="flow" marker-end="url(#a)"/>
  <text x="604" y="150" class="m">push</text>
  <text x="604" y="165" class="m">webhook</text>

  <!-- Zone: platform and build -->
  <rect x="300" y="452" width="484" height="132" rx="10" fill="#fafbfc" stroke="#818b98" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="312" y="470" class="zl" fill="#59636e">Platform and build</text>
  <rect x="316" y="498" width="134" height="64" rx="8" class="box"/>
  <text x="383" y="520" class="b c">Dependencies</text>
  <text x="383" y="538" class="m c">base images,</text>
  <text x="383" y="553" class="m c">crates, PyPI</text>
  <rect x="478" y="498" width="128" height="64" rx="8" class="box"/>
  <text x="542" y="524" class="b c">Container image</text>
  <text x="542" y="543" class="m c">Rust or Python</text>
  <rect x="640" y="498" width="128" height="64" rx="8" class="box"/>
  <text x="704" y="524" class="b c">Operator</text>
  <text x="704" y="543" class="m c">config, secrets</text>
  <path d="M452,530 L474,530" class="flow" marker-end="url(#a)"/>
  <path d="M520,496 L520,398" class="flow" marker-end="url(#a)"/>
  <path d="M664,496 L544,372" class="flow" marker-end="url(#a)"/>
  <path d="M366,452 L366,386" class="flow" marker-end="url(#a)"/>
  <text x="374" y="428" class="m">probes</text>

  <!-- Zone: identity provider -->
  <rect x="16" y="452" width="212" height="132" rx="10" fill="#f2fbfc" stroke="#1b7c83" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="28" y="470" class="zl" fill="#1b7c83">Identity provider</text>
  <rect x="32" y="482" width="180" height="86" rx="8" fill="#d8f3f5" stroke="#1b7c83" stroke-width="1.3"/>
  <text x="122" y="505" class="b c">Entra ID</text>
  <text x="122" y="525" class="m c">users sign in here.</text>
  <text x="122" y="541" class="m c">With sign-in on, docs-mcp</text>
  <text x="122" y="557" class="m c">fetches its signing keys</text>
  <path d="M214,486 L313,94" class="flow" marker-end="url(#a)"/>
  <text x="238" y="440" class="m">signing keys</text>

  <!-- Legend -->
  <rect x="16" y="600" width="768" height="38" rx="10" fill="#f6f8fa"/>
  <circle cx="40" cy="619" r="11" class="ep"/><text x="40" y="623" class="ept">E1</text>
  <text x="60" y="624">entry point, see the table</text>
  <line x1="262" y1="619" x2="292" y2="619" stroke="#59636e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="302" y="624">trust boundary</text>
  <path d="M440,619 L468,619" class="flow" marker-end="url(#a)"/>
  <text x="478" y="624">data flow</text>

  <!-- Entry points -->
  <circle cx="300" cy="73" r="11" class="ep"/><text x="300" y="77" class="ept">E1</text>
  <circle cx="540" cy="102" r="11" class="ep"/><text x="540" y="106" class="ept">E2</text>
  <circle cx="366" cy="396" r="11" class="ep"/><text x="366" y="400" class="ept">E3</text>
  <circle cx="698" cy="220" r="11" class="ep"/><text x="698" y="224" class="ept">E4</text>
  <circle cx="540" cy="289" r="11" class="ep"/><text x="540" y="293" class="ept">E5</text>
  <circle cx="640" cy="498" r="11" class="ep"/><text x="640" y="502" class="ept">E6</text>
  <circle cx="316" cy="498" r="11" class="ep"/><text x="316" y="502" class="ept">E7</text>
  <circle cx="300" cy="153" r="11" class="ep"/><text x="300" y="157" class="ept">E8</text>
</svg>
