[project]
name = "docs-mcp"
version = "0.1.0"
description = "MCP server that serves a folder of Markdown docs from git"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pyyaml==6.0.3",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.scripts]
docs-mcp = "docs_mcp.__main__:main"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.12"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
