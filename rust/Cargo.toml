[package]
name = "docs-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "MCP server that serves a folder of Markdown docs from git"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = "0.2.38"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.9.0", features = ["server", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yaml-rust2 = "0.13.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"   # docs_mcp::index::DocIndex reads fine
missing_errors_doc = "allow"        # a binary, not a library

[profile.release]
strip = true
lto = "thin"
